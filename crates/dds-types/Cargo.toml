[package]
name = "dds-types"
version = "0.1.0"
edition = "2021"
description = "Foundation types for the DDS stack: GUIDs, QoS policies, time, locators, status"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"
elided-lifetimes-in-paths = "allow"

[lints.clippy]
all = { level = "warn", priority = -4 }
restriction = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -1 }
needless_return = { level = "allow", priority = 10 }
implicit_return = { level = "warn", priority = 10 }
