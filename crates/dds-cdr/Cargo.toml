[package]
name = "dds-cdr"
version = "0.1.0"
edition = "2021"
description = "CDR/XCDR/XCDR2 serialization for DDS"
license = "MIT OR Apache-2.0"

[dependencies]
dds-types = { workspace = true }
bytes = { workspace = true }
byteorder = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = { level = "allow", priority = 10 }
elided-lifetimes-in-paths = { level = "allow", priority = 10 }

[lints.clippy]
all = { level = "warn", priority = -4 }
restriction = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -1 }
needless_return = { level = "allow", priority = 10 }
implicit_return = { level = "allow", priority = 10 }
pub_use = { level = "allow", priority = 10 }
indexing_slicing = { level = "allow", priority = 10 }
string_slice = { level = "allow", priority = 10 }
absolute_paths = { level = "allow", priority = 10 }
as_conversions = { level = "allow", priority = 10 }
cast_possible_truncation = { level = "allow", priority = 10 }
cast_lossless = { level = "allow", priority = 10 }
cast_sign_loss = { level = "allow", priority = 10 }
cast_possible_wrap = { level = "allow", priority = 10 }
missing_inline_in_public_items = { level = "allow", priority = 10 }
shadow_reuse = { level = "allow", priority = 10 }
shadow_same = { level = "allow", priority = 10 }
shadow_unrelated = { level = "allow", priority = 10 }
missing_errors_doc = { level = "allow", priority = 10 }
missing_panics_doc = { level = "allow", priority = 10 }
wildcard_imports = { level = "allow", priority = 10 }
integer_division = { level = "allow", priority = 10 }
integer_division_remainder_used = { level = "allow", priority = 10 }
single_call_fn = { level = "allow", priority = 10 }
default_numeric_fallback = { level = "allow", priority = 10 }
arithmetic_side_effects = { level = "allow", priority = 10 }
std_instead_of_core = { level = "allow", priority = 10 }
std_instead_of_alloc = { level = "allow", priority = 10 }
alloc_instead_of_core = { level = "allow", priority = 10 }
arbitrary_source_item_ordering = { level = "allow", priority = 10 }
min_ident_chars = { level = "allow", priority = 10 }
exhaustive_enums = { level = "allow", priority = 10 }
exhaustive_structs = { level = "allow", priority = 10 }
module_name_repetitions = { level = "allow", priority = 10 }
question_mark_used = { level = "allow", priority = 10 }
single_char_lifetime_names = { level = "allow", priority = 10 }
panic_in_result_fn = { level = "allow", priority = 10 }
unwrap_used = { level = "allow", priority = 10 }
unwrap_in_result = { level = "allow", priority = 10 }
cognitive_complexity = { level = "allow", priority = 10 }
tests_outside_test_module = { level = "allow", priority = 10 }
missing_docs_in_private_items = { level = "allow", priority = 10 }
pattern_type_mismatch = { level = "allow", priority = 10 }
redundant_pub_crate = { level = "allow", priority = 10 }
similar_names = { level = "allow", priority = 10 }
else_if_without_else = { level = "allow", priority = 10 }
unseparated_literal_suffix = { level = "allow", priority = 10 }
separated_literal_suffix = { level = "allow", priority = 10 }
allow_attributes_without_reason = { level = "allow", priority = 10 }
doc_paragraphs_missing_punctuation = { level = "allow", priority = 10 }
match_like_matches_macro = { level = "allow", priority = 10 }
wildcard_enum_match_arm = { level = "allow", priority = 10 }
map_err_ignore = { level = "allow", priority = 10 }
use_self = { level = "allow", priority = 10 }
inconsistent_struct_constructor = { level = "allow", priority = 10 }
