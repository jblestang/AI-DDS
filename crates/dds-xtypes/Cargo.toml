[package]
name = "dds-xtypes"
version = "0.1.0"
edition = "2021"
description = "DDS XTypes 1.3 — Type system, TypeObject, TypeIdentifier"
license = "MIT OR Apache-2.0"

[dependencies]
dds-types = { workspace = true }
dds-cdr = { workspace = true }
sha2 = { workspace = true }
md5 = "0.7"
thiserror = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
elided_lifetimes_in_paths = "allow"
elided-lifetimes-in-paths = "allow"

[lints.clippy]
all = { level = "warn", priority = -4 }
restriction = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -1 }
needless_return = { level = "allow", priority = 10 }
implicit_return = { level = "warn", priority = 10 }
module_name_repetitions = { level = "allow", priority = 10 }
pattern_type_mismatch = { level = "allow", priority = 10 }
